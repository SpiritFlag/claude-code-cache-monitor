<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-monitor</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e8ee; --dim:#8b93a7; --ok:#3ddc84; --warn:#ffc857; --bad:#ff5c5c; --acc:#6ea8fe; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  .app { display:grid; grid-template-columns: 300px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside #list { flex:1; overflow:auto; scrollbar-width:none; -ms-overflow-style:none; }
  aside #list::-webkit-scrollbar { display:none; }
  .side-habits { border-top:1px solid var(--line); background:#131620; padding:10px 12px 12px; font-size:12px; }
  .side-habits h1 { padding:0 0 6px; }
  .side-habits table { font-size:11px; } .side-habits td, .side-habits th { padding:3px 4px; }
  .score { display:flex; gap:14px; align-items:center; }
  .score .grade { font: 800 52px/1 var(--mono); }
  .score .pts { font: 600 18px var(--mono); color:var(--dim); }
  .srow { display:grid; grid-template-columns: 92px 1fr 44px; gap:8px; align-items:center; font-size:12px; margin-top:6px; }
  .srow .bar { margin:0; height:8px; } .srow em { font: 11px var(--mono); color:var(--dim); font-style:normal; text-align:right; }
  .char { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .char .bubble { background:#232836; border-radius:12px; padding:9px 14px; position:relative; font-size:14px; font-weight:600; text-align:center; max-width:100%; }
  .char .bubble::after { content:''; position:absolute; left:50%; bottom:-8px; margin-left:-8px; border:8px solid transparent; border-top-color:#232836; border-bottom:0; }
  .char img { width:170px; height:170px; image-rendering:auto; }
  /* 아바타 아래 모델명 이름표: 말풍선 두 개가 위아래로 마주보면 어색해서 꼬리 없이 둥근 배지로만 둔다 */
  .char .bubble.down { font-size:12px; font-weight:500; color:var(--dim); padding:6px 12px; }
  .char .bubble.down::after { display:none; }
  .hero { display:flex; gap:14px; align-items:center; }
  .hero .lv { font: 800 44px/1 var(--mono); color:var(--acc); } .hero .lv small { font-size:14px; color:var(--dim); margin-right:4px; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:12px; }
  .stats > div { background:#232836; border-radius:6px; padding:6px 9px; display:flex; justify-content:space-between; align-items:baseline; }
  .stats span { font-size:11px; color:var(--dim); } .stats b { font: 600 13px var(--mono); }
  .badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
  .badge { font-size:11px; padding:3px 8px; border-radius:999px; background:#1c202a; color:#4a5160; border:1px solid var(--line); }
  .badge.on { color:var(--warn); border-color:#5a4a1e; background:#2a2415; }
  .fun { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:10px; font: 11px var(--mono); color:var(--dim); }
  .fun b { color:var(--fg); font-weight:600; }
  aside h1 { font-size:13px; letter-spacing:.08em; color:var(--dim); margin:0; padding:14px 16px 8px; text-transform:uppercase; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  aside h1 button { background:none; border:0; color:var(--dim); cursor:pointer; font:16px/1 var(--mono); padding:2px 5px; border-radius:4px; }
  aside h1 button:hover { background:#232836; color:var(--fg); }
  .app.nav-collapsed { grid-template-columns: 44px 1fr; }
  .app.nav-collapsed aside h1 { padding:14px 0 8px; justify-content:center; }
  .app.nav-collapsed aside h1 span, .app.nav-collapsed aside .root, .app.nav-collapsed aside #list, .app.nav-collapsed aside #habits { display:none; }
  aside .root { font:11px var(--mono); color:var(--dim); padding:0 16px 10px; word-break:break-all; }
  .sess { padding:10px 16px; border-top:1px solid var(--line); cursor:pointer; }
  .sess:hover { background:#1b1f28; } .sess.sel { background:#1f2532; border-left:3px solid var(--acc); padding-left:13px; }
  .sess .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sess .m { font:11px var(--mono); color:var(--dim); margin-top:3px; display:flex; gap:8px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#444; margin-right:6px; vertical-align:middle; }
  .dot.live { background:var(--ok); } .dot.busy { background:var(--acc); animation:pulse 1s infinite; } .dot.dead { background:#444; }
  @keyframes pulse { 50% { opacity:.3; } }
  main { padding:20px 24px; overflow:auto; display:flex; flex-direction:column; gap:16px; scrollbar-width:none; -ms-overflow-style:none; }
  main::-webkit-scrollbar { display:none; }
  .top { display:grid; grid-template-columns: 280px 1fr 1fr 240px; gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { margin:0 0 6px; font-size:12px; color:var(--dim); font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .card.cost-card { display:flex; flex-direction:column; }
  .cost-mid { flex:1; display:flex; align-items:center; }
  .cost-head { display:flex; gap:16px; align-items:center; }
  .cost-left { flex:none; }
  .cost-right { flex:1; min-width:0; }
  .today-total { margin-top:4px; font-size:13px; color:var(--dim); }
  .today-total b { font: 600 20px var(--mono); color:var(--fg); margin-left:6px; }
  .cost-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .cost-stats > div { background:#232836; border-radius:6px; padding:6px 9px; display:flex; flex-direction:column; gap:2px; }
  .cost-stats span { font-size:11px; color:var(--dim); }
  .cost-stats b { font: 600 13px var(--mono); }
  .big { font: 700 44px/1 var(--mono); }
  .sub { color:var(--dim); font-size:12px; margin-top:6px; font-family:var(--mono); }
  .ttl { text-align:center; }
  .ring { position:relative; width:180px; height:180px; margin:6px auto 0; }
  .ring svg { transform:rotate(-90deg); }
  .ring .num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .num .big { font-size:40px; }
  .bar { height:10px; background:#232836; border-radius:5px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; background:var(--acc); }
  /* 연비 3줄: 세로로 쌓인 가로 트랙 위에 값 위치를 원으로 찍는다($0~100/h 척도) */
  .fuel { display:flex; flex-direction:column; gap:8px; margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
  .fuel .fuel-h { font-size:11px; color:var(--dim); font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-bottom:2px; }
  .fuel-row { display:flex; align-items:center; gap:8px; }
  .fuel-row .fl { width:50px; flex:none; font-size:11px; color:var(--dim); }
  .fuel-row .ftrack { position:relative; flex:1; height:4px; background:#232836; border-radius:2px; }
  .fuel-row .fdot { position:absolute; top:50%; width:10px; height:10px; margin-top:-5px; margin-left:-5px; border-radius:50%; background:var(--acc); }
  .fuel-row .fv { flex:none; display:flex; align-items:baseline; }
  .fuel-row .fv .amt { width:58px; text-align:right; font: 600 12px var(--mono); }
  .fuel-row .fv .pm { width:62px; text-align:right; font: 11px var(--mono); font-weight:400; color:var(--dim); }
  .fuel-row .fv .fd { width:56px; text-align:right; font: 11px var(--mono); font-weight:400; color:var(--dim); }
  .stack { display:flex; height:22px; border-radius:6px; overflow:hidden; background:#232836; }
  .stack i { display:block; height:100%; min-width:1px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:12px; color:var(--dim); }
  .legend .li b { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .legend .li em { font: 11px var(--mono); color:var(--fg); font-style:normal; margin-left:4px; }
  table.tools td:nth-child(3) { width:40%; } .tb { height:8px; background:#232836; border-radius:4px; overflow:hidden; } .tb i { display:block; height:100%; background:#ff9f43; }
  .advice { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; }
  .advice b { color:var(--ok); font-family:var(--mono); } .advice.dim { color:var(--dim); font-size:12px; }
  .advice.strong { border-top-color:var(--ok); } .advice.strong b { color:var(--ok); }
  .advice button, .mh button { background:#2a3140; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .advice button:hover, .mh button:hover { background:#354055; }
  .modal[hidden] { display:none; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:10; }
  .modal .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; width:min(640px, 92vw); padding:18px 22px; max-height:85vh; overflow:auto; }
  .modal .mh { display:flex; justify-content:space-between; align-items:center; font-weight:600; margin-bottom:8px; }
  .modal h3 { font-size:13px; margin:14px 0 6px; color:var(--acc); } .modal h3 em { font: 12px var(--mono); color:var(--dim); font-style:normal; margin-left:8px; }
  .modal ul { margin:0; padding-left:18px; } .modal li { margin:4px 0; } .modal li b { font-family:var(--mono); }
  table.habits td:first-child { white-space:normal; } table.habits tr.dim { color:var(--dim); } table.habits .z { color:#4a5160; } table.habits b { color:var(--bad); }
  .card.strip .chips { gap:6px; } .card.strip .chip { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:#232836; border-radius:6px; padding:5px 9px; font: 12px var(--mono); }
  .chip b { color:var(--dim); font-weight:500; margin-right:6px; }
  canvas { width:100%; height:260px; display:block; }
  table { width:100%; border-collapse:collapse; font: 12px var(--mono); }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; }
  .legend .li b.dash { width:3px; height:11px; border-radius:0; }
  .empty { color:var(--dim); padding:40px; text-align:center; }
  .warnbox { border-left:3px solid var(--bad); background:#2a1a1a; padding:10px 12px; border-radius:6px; font-size:13px; }
  .okbox { border-left:3px solid var(--ok); background:#172a1f; padding:10px 12px; border-radius:6px; font-size:13px; }
  /* narrow layouts: 4-up top row folds so Cost and the character drop to a second line.
     On that second line they swap: the character fits the 280px column, Cost needs the wide one so the 연비 rows keep a readable track next to their fixed-width values. */
  @media (max-width: 1280px) {
    .top { grid-template-columns: 280px 1fr; }
    .top > :nth-child(3) { order: 2; } /* Cost -> right */
    .top > :nth-child(4) { order: 1; } /* character -> left */
  }
  @media (max-width: 720px) { .top { grid-template-columns: 1fr; } .top > :nth-child(3), .top > :nth-child(4) { order: 0; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <h1><span>Sessions</span><button id="navbtn" title="세션 목록 접기/펼치기">&lsaquo;</button></h1>
    <div class="root" id="root"></div>
    <div id="list"></div>
    <div id="habits" class="side-habits"></div>
  </aside>
  <main id="main"><div class="empty">세션 선택 대기 중…</div></main>
</div>
<div id="modal" class="modal" hidden onclick="if(event.target===this)closeAdvice()"></div>
<script>
const $ = s => document.querySelector(s);
const fmtTok = n => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(0)+'k' : String(Math.round(n||0));
const usd = n => '$' + (n||0).toFixed(2);
const short = m => (m||'').replace('claude-','').replace('-4-5-20251001','');
const ago = ms => { if (ms < 60e3) return Math.floor(ms/1000)+'s'; if (ms < 3600e3) return Math.floor(ms/60e3)+'m'; if (ms < 86400e3) return (ms/3600e3).toFixed(1)+'h'; return (ms/86400e3).toFixed(1)+'d'; };
const DAY_SHIFT = 4 * 3600e3;
const dayKey = ts => new Date(ts + DAY_SHIFT).toISOString().slice(0, 10);
const hrs = ms => { const h = ms / 3600e3; return h >= 1 ? h.toFixed(1) + 'h' : Math.round(ms / 60e3) + 'm'; };
const perHrNum = (cost, ms) => ms > 0 ? cost / (ms / 3600e3) : null;

let state = null, selected = null, detailCache = {}, clockSkew = 0;

const es = new EventSource('/events');
es.onmessage = e => { state = JSON.parse(e.data); clockSkew = state.now - Date.now(); if (!selected && state.sessions.length) selected = state.sessions[0].id; renderList(); loadDetail(selected, true); };

function status(s) { const now = Date.now()+clockSkew; if (s.busy || s.subActive) return 'busy'; if (now - s.lastCallEnd < s.ttlMin*60e3) return 'live'; return 'dead'; }

function renderList() {
  $('#root').textContent = state.root;
  $('#list').innerHTML = state.sessions.map(s => `
    <div class="sess ${s.id===selected?'sel':''}" data-id="${s.id}">
      <div class="t"><span class="dot ${status(s)}"></span>${esc(s.title)}</div>
      <div class="m"><span>${short(s.model)}</span><span>${fmtTok(s.ctx)}</span><span>${usd(s.cost)}</span><span class="ago" data-ts="${s.lastTs}">${ago(Date.now()+clockSkew-s.lastTs)}</span></div>
    </div>`).join('');
  document.querySelectorAll('.sess').forEach(el => el.onclick = () => { selected = el.dataset.id; renderList(); loadDetail(selected, true); });
  const sel = state.sessions.find(x => x.id === selected);
  $('#habits').innerHTML = sel ? `<h1>캐시를 깨는 나쁜 습관</h1>${habitsCard(sel)}` : '';
}
function scoreCard(s) {
  const a = s.advice || {}; const ttl = (s.byCause && s.byCause.ttl_expiry && s.byCause.ttl_expiry.n) || 0;
  const avoidable = s.breakCost;
  const breakShare = s.cost ? avoidable / s.cost : 0;
  const readPerOut = s.out ? s.cacheRead / s.out : 0;
  const parts = [
    { label: '캐시 규율', max: 40, v: 40 * Math.max(0, 1 - breakShare / 0.2), note: `깨짐 손실 ${Math.round(breakShare * 100)}% of cost` },
    { label: '컨텍스트 청결', max: 30, v: 30 * (1 - Math.min(1, a.deadPct || 0)), note: `폐기물 ${Math.round((a.deadPct || 0) * 100)}%` },
    { label: '읽기 절제', max: 15, v: 15 * Math.max(0, Math.min(1, 1 - (readPerOut - 100) / 900)), note: `출력 1토큰당 ${Math.round(readPerOut)} 읽음` },
    { label: '시간 규율', max: 15, v: Math.max(0, 15 - 5 * ttl), note: `TTL 만료 ${ttl}건` },
  ];
  const total = Math.round(parts.reduce((n, p) => n + p.v, 0));
  const grade = total >= 90 ? 'S' : total >= 75 ? 'A' : total >= 60 ? 'B' : total >= 45 ? 'C' : 'D';
  const gcol = { S: 'var(--ok)', A: 'var(--ok)', B: 'var(--acc)', C: 'var(--warn)', D: 'var(--bad)' }[grade];
  const perPrompt = s.prompts ? Math.round(s.out / s.prompts) : 0; const callsPerPrompt = s.prompts ? (s.calls / s.prompts).toFixed(1) : '-';
  return `<div class="score"><div class="grade" style="color:${gcol}">${grade}</div><div><div class="pts">${total} / 100</div><div class="sub">${verdict(grade, parts)}</div></div></div>` +
    parts.map(p => `<div class="srow"><span>${p.label}</span><div class="bar"><i style="width:${100 * p.v / p.max}%;background:${p.v / p.max > .7 ? 'var(--ok)' : p.v / p.max > .4 ? 'var(--warn)' : 'var(--bad)'}"></i></div><em>${Math.round(p.v)}/${p.max}</em></div><div class="sub" style="margin:-2px 0 0 100px;font-size:11px">${p.note}</div>`).join('') +
    `<div class="fun"><span>말 한마디당 <b>${fmtTok(perPrompt)}</b> 출력</span><span>프롬프트당 <b>${callsPerPrompt}</b>호출</span><span>thinking <b>${s.out ? Math.round(100 * s.think / s.out) : 0}%</b></span><span>질문 <b>${s.asks}</b>번</span></div>`;
}
// ---- character card: state image + line (states defined in character-spec.md)
const LINES = { broke: '아야… 다시 다 읽었어요', asking: '형, 어떻게 할까요?', working: '작업 중…', full: '배가 불러요…', sleepy: '졸려요… 곧 잊어버릴 것 같아요', asleep: '자고 있어요. 깨워도 돼요', amnesia: '깨우면 다 까먹은 상태예요', idle: '대기 중' };
const WHY = s => ({ broke: '3분 내 피할 수 있던 캐시 깨짐', asking: '질문 띄우고 답 기다리는 중', working: '도구 호출 중', full: `컨텍스트 ${fmtTok(s.ctx)}`, sleepy: 'TTL 12분 미만', asleep: `만료 · ${fmtTok(s.ctx)} < 임계 ${fmtTok(s.continueThreshold)}`, amnesia: `만료 · ${fmtTok(s.ctx)} ≥ 임계 ${fmtTok(s.continueThreshold)}`, idle: '' })[s.charState] || '';
function charCard(s) {
  const st = s.charState || 'idle';
  return `<div class="char"><div class="bubble" title="${st} · ${WHY(s)}">${LINES[st] || ''}</div>`
    + `<img src="/img/${st}.png" alt="${st}">`
    + `<div class="bubble down">${short(s.model)}</div></div>`;
}
// 오늘(이 세션이 속한 하루, KST 05시 경계, 폴더 전체 집계) 버킷 — 연비 위젯과 누적 총액 줄이 함께 쓴다.
function todayBucket(s) {
  const fo = state.folder; if (!fo) return { activeMs: 0, cost: 0 };
  return fo.days[dayKey(s.lastTs)] || { activeMs: 0, cost: 0 };
}
// Cost 카드의 연비 3줄: 이 세션 · 오늘(이 세션이 속한 하루, 폴더 전체 집계) · 이 기기(폴더 전체 누적).
// 시간당 비용을 $0~100/h 척도의 가로 트랙 위에 원으로 찍고, 시간당·분당 값과 활성시간은 트랙 오른쪽에 적는다.
const FUEL_SCALE = 100;
function fuelCells(s) {
  const fo = state.folder; if (!fo) return '';
  const today = todayBucket(s);
  const rows = [
    ['이 세션', perHrNum(s.cost, s.activeMs), s.activeMs],
    ['오늘', perHrNum(today.cost, today.activeMs), today.activeMs],
    ['이 기기', perHrNum(fo.cost, fo.activeMs), fo.activeMs],
  ];
  return `<div class="fuel" title="시간당·분당 비용 · $0~${FUEL_SCALE}/h 척도 · 활성시간 = 모델이 실제로 돌던 시간만 합산, 대기·생각 시간 제외. 하루 경계는 KST 05시">`
    + `<div class="fuel-h">활성 시간 대비 COST</div>`
    + rows.map(([label, perHr, ms]) => {
      const pct = perHr == null ? 0 : Math.min(100, perHr / FUEL_SCALE * 100);
      return `<div class="fuel-row">
        <div class="fl">${label}</div>
        <div class="ftrack"><i class="fdot" style="left:${pct}%"></i></div>
        <div class="fv"><span class="amt">${perHr == null ? '-' : usd(perHr) + '/h'}</span><span class="pm">${perHr == null ? '' : usd(perHr / 60) + '/min'}</span><span class="fd">활성 ${hrs(ms)}</span></div>
      </div>`;
    }).join('')
    + `</div>`;
}
// ---- RPG character sheet: XP accrues across the whole folder; the session shows what it added
const xpOf = s => Math.max(0, Math.round(10 * (s.saved || 0) + 25 * (s.commits || 0) + (s.prompts || 0)));
const levelOf = xp => Math.floor(Math.sqrt(xp / 100)) + 1;
const xpForLevel = l => 100 * (l - 1) * (l - 1);
function heroCard(s) {
  const all = state.sessions; const sum = k => all.reduce((n, x) => n + (x[k] || 0), 0);
  const xp = all.reduce((n, x) => n + xpOf(x), 0); const lv = levelOf(xp); const lo = xpForLevel(lv), hi = xpForLevel(lv + 1); const pct = Math.round(100 * (xp - lo) / (hi - lo));

    for (let k = 0; k < COMP.length; k++) {
      ctx.fillStyle = COMP[k][2] + 'aa'; ctx.beginPath();
      const base = p => (p.c || []).slice(0, k).reduce((n, v) => n + v, 0), top = p => base(p) + ((p.c || [])[k] || 0);
      pts.forEach((p, i) => { const x = X(p.a), y = Y(top(p)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(X(pts[i].a), Y(base(pts[i])));
      ctx.closePath(); ctx.fill();
    }
  } else {
    const y0 = Y(0);
    for (let i = 1; i < pts.length; i++) { const a = pts[i-1], b = pts[i]; ctx.fillStyle = (col[b.m] || '#ccc') + '22'; ctx.beginPath(); ctx.moveTo(X(a.a), y0); ctx.lineTo(X(a.a), Y(a.ctx)); ctx.lineTo(X(b.a), Y(b.ctx)); ctx.lineTo(X(b.a), y0); ctx.closePath(); ctx.fill(); }
  }
  ctx.lineWidth = 1.5;
  for (let i = 1; i < pts.length; i++) { const a = pts[i-1], b = pts[i]; ctx.strokeStyle = col[b.m] || '#ccc'; ctx.beginPath(); ctx.moveTo(X(a.a), Y(a.ctx)); ctx.lineTo(X(b.a), Y(b.ctx)); ctx.stroke(); }
  for (const b of breaks) if (!b.sub) { ctx.strokeStyle = causeColor(b.cause); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(CX(b.a), T); ctx.lineTo(CX(b.a), H-B); ctx.stroke(); ctx.setLineDash([]); }
  // 범례: 구성 8층(hasComp일 때만) -> 이 세션 breaks에 실제로 나온 원인 묶음(.dash, D-10)
  const seenGroups = []; const seenKeys = new Set();
  for (const b of breaks) if (!b.sub) { const g = causeGroup(b.cause); if (!seenKeys.has(g.key)) { seenKeys.add(g.key); seenGroups.push(g); } }
  const lg = $('#legend');
  if (lg) lg.innerHTML =
    (hasComp ? COMP.map(([k, label, c]) => `<span class="li"><b style="background:${c}"></b>${label}</span>`).join('') : '') +
    seenGroups.map(g => `<span class="li"><b class="dash" style="background:${g.color}"></b>${g.label}</span>`).join('');
}

function resumeBox(s) {
  // D-12. TTL 만료 후 갈림길 — 이어가기(riskUsd) vs 새 세션(freshCost), 차액(costDelta)이 방향을 정한다
  const ok = s.costDelta < 0; // 이어가기가 싸다
  return `<div class="${ok ? 'okbox' : 'warnbox'}">${ok ? '이 세션에서 대화를 이어가도 됩니다' : '새로운 세션에서 대화를 시작하세요'}</div>
    <div class="sub" style="margin-top:6px">이어가기 <b>${usd(s.riskUsd)}</b> · 새 세션 <b>${usd(s.freshCost)}</b> · 차액 <b style="color:${ok ? 'var(--ok)' : 'var(--warn)'}">${usd(Math.abs(s.costDelta))}</b> (${ok ? '이어가기가' : '새 세션이'} 쌈)</div>
    <div class="sub" style="margin-top:4px">임계 ${fmtTok(s.continueThreshold)} (바닥 ${fmtTok(s.sysTokens)} + 다시 읽기 ${fmtTok(s.continueThreshold - s.sysTokens)}, ${SYS_SRC[s.sysSource] || '추정'}) · 지금 ${fmtTok(s.ctx)}</div>`;
}
function tick() {
  if (!state) return; const s = state.sessions.find(x => x.id === selected); if (!s) return;
  const now = Date.now()+clockSkew; const ttlMs = s.ttlMin*60e3; const left = s.lastCallStart + ttlMs - now;
  const el = $('#ttl'), arc = $('#arc'), sub = $('#ttlsub'), warn = $('#ttlwarn'); if (!el) return;
  if (left > 0) {
    const mm = Math.floor(left/60e3), ss = Math.floor(left%60e3/1000); el.textContent = `${mm}:${String(ss).padStart(2,'0')}`;
    const frac = left/ttlMs; arc.setAttribute('stroke-dashoffset', String(502.6*(1-frac))); arc.setAttribute('stroke', frac > .5 ? 'var(--ok)' : frac > .2 ? 'var(--warn)' : 'var(--bad)');
    sub.textContent = '마지막 호출 ' + ago(now - s.lastCallStart) + ' 전';
    warn.innerHTML = `<div class="sub" style="font-size:13px">깨뜨리면 <b style="color:var(--warn);font-family:var(--mono)">${usd(s.riskUsd)}</b> <span style="color:var(--dim)">(현재 cost의 ${s.cost ? Math.round(100 * s.riskUsd / s.cost) : 0}%)</span></div>` + (frac < .2 ? `<div class="warnbox" style="margin-top:8px">곧 만료. 지금 치면 캐시 히트</div>` : '');
  } else {
    el.textContent = '만료'; arc.setAttribute('stroke-dashoffset', '502.6'); arc.setAttribute('stroke', 'var(--bad)');
    sub.textContent = ago(-left) + ' 전 만료';
    warn.innerHTML = resumeBox(s);
  }
  document.querySelectorAll('.ago').forEach(a => a.textContent = ago(now - +a.dataset.ts));
}
setInterval(tick, 1000);

// ---- session list collapse; the choice is per-browser and survives reloads
const NAVKEY = 'cc-monitor:nav-collapsed';
function applyNav(on) { $('#app').classList.toggle('nav-collapsed', on); $('#navbtn').textContent = on ? '\u203a' : '\u2039'; }
$('#navbtn').onclick = () => {
  const on = !$('#app').classList.contains('nav-collapsed');
  applyNav(on);
  try { localStorage.setItem(NAVKEY, on ? '1' : '0'); } catch (e) { }
  requestAnimationFrame(() => { const d = detailCache[selected]; if (d) drawChart(d.series, d.breaks, d.prompts); }); // the canvas got wider or narrower
};
try { applyNav(localStorage.getItem(NAVKEY) === '1'); } catch (e) { }
let rsz = null; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { const d = detailCache[selected]; if (d) drawChart(d.series, d.breaks, d.prompts); }, 100); });
</script>
</body>
